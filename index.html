<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

<title>Brew Center</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
:root{
  --bg:#F5F0EB; --surface:#FFFBF6; --surface2:#EDE4D8; --ink:#3D2E1F; --muted:#8A7A65;
  --primary:#6F4E37; --primary-ink:#FFF8EE; --accent:#C4A265; --gold:#B8860B;
  --line:#E0D5C5; --ok:#5B7A3A; --shadow:0 6px 24px rgba(70,40,20,.10), 0 1px 3px rgba(70,40,20,.08);
  --r:18px; --r-s:12px; --nav-h:64px;
}
[data-theme="dark"]{
  --bg:#1A1410; --surface:#261E18; --surface2:#352A20; --ink:#F0E6D7; --muted:#A89982;
  --primary:#C4956A; --primary-ink:#1A1008; --accent:#D4B87A; --gold:#E0B860;
  --line:#3D3024; --ok:#9DBA6E; --shadow:0 6px 24px rgba(0,0,0,.45), 0 1px 3px rgba(0,0,0,.4);
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  font-family:'Sarabun',sans-serif; background:var(--bg); color:var(--ink);
  font-size:16.5px; line-height:1.55; padding-bottom:calc(var(--nav-h) + env(safe-area-inset-bottom));
  background-image:radial-gradient(rgba(111,78,55,.05) 1px, transparent 1.4px);
  background-size:22px 22px; min-height:100vh;
}
h1,h2,h3,.display{font-family:'Fraunces',serif; line-height:1.2; margin:0 0 .4em}
button{font-family:inherit}
header.app{
  position:sticky; top:0; z-index:30; display:flex; align-items:center; gap:8px;
  padding:calc(10px + env(safe-area-inset-top)) 16px 10px; background:color-mix(in srgb, var(--bg) 88%, transparent);
  backdrop-filter:blur(12px); -webkit-backdrop-filter:blur(12px); border-bottom:1px solid var(--line);
}
header.app .brand{font-family:'Fraunces',serif; font-weight:700; font-size:21px; letter-spacing:.2px; flex:1; display:flex; align-items:center; gap:8px}
header.app .brand .crumb{display:inline-block; width:10px; height:10px; border-radius:50%; background:var(--accent)}
.iconbtn{
  border:1px solid var(--line); background:var(--surface); color:var(--ink); border-radius:999px;
  min-width:42px; height:42px; padding:0 12px; font-size:15px; font-weight:600; cursor:pointer;
  display:inline-flex; align-items:center; justify-content:center; gap:6px;
}
.iconbtn:active{transform:scale(.96)}
main{padding:18px 16px 28px; max-width:760px; margin:0 auto}
.tagline{color:var(--muted); font-size:14px; margin:-4px 0 14px}
.card{background:var(--surface); border:1px solid var(--line); border-radius:var(--r); box-shadow:var(--shadow); padding:16px; margin-bottom:14px}
.card.flat{box-shadow:none}
.row{display:flex; gap:10px; align-items:center}
.row .grow{flex:1}
.chip{display:inline-flex; align-items:center; gap:6px; padding:5px 12px; border-radius:999px; background:var(--surface2); border:1px solid var(--line); font-size:13px; font-weight:600; color:var(--muted); cursor:pointer}
.chip.on{background:var(--primary); color:var(--primary-ink); border-color:var(--primary)}
.btn{
  display:inline-flex; align-items:center; justify-content:center; gap:8px; cursor:pointer;
  background:var(--primary); color:var(--primary-ink); border:none; border-radius:999px;
  padding:13px 22px; font-size:16px; font-weight:700; box-shadow:var(--shadow);
}
.btn.big{width:100%; padding:16px; font-size:18px}
.btn.ghost{background:var(--surface); color:var(--ink); border:1px solid var(--line); box-shadow:none}
.btn.warn{background:var(--accent); color:#fff}
.btn:active{transform:scale(.97)}
.btn:disabled{opacity:.45; pointer-events:none}
input,select,textarea{
  font-family:inherit; font-size:16px; color:var(--ink); background:var(--surface);
  border:1.5px solid var(--line); border-radius:var(--r-s); padding:11px 12px; width:100%;
}
input:focus,select:focus,textarea:focus{outline:none; border-color:var(--primary)}
label.f{display:block; font-size:13px; font-weight:700; color:var(--muted); margin:12px 0 5px; text-transform:uppercase; letter-spacing:.4px}
nav.bottom{
  position:fixed; left:0; right:0; bottom:0; z-index:40; height:calc(var(--nav-h) + env(safe-area-inset-bottom));
  padding-bottom:env(safe-area-inset-bottom); display:flex; background:var(--surface);
  border-top:1px solid var(--line); box-shadow:0 -4px 20px rgba(80,50,20,.08);
}
nav.bottom button{
  flex:1; border:none; background:none; color:var(--muted); font-size:11px; font-weight:700;
  display:flex; flex-direction:column; align-items:center; justify-content:center; gap:3px; cursor:pointer; padding-top:6px;
}
nav.bottom button svg{width:24px; height:24px; stroke:currentColor; fill:none; stroke-width:1.8; stroke-linecap:round; stroke-linejoin:round}
nav.bottom button.on{color:var(--primary)}
nav.bottom button.on svg{stroke-width:2.3}
.recipe-card{display:flex; gap:14px; align-items:center; cursor:pointer}
.recipe-card .ico{width:54px; height:54px; border-radius:16px; background:var(--surface2); display:flex; align-items:center; justify-content:center; font-size:28px; flex-shrink:0}
.recipe-card h3{margin:0; font-size:18px}
.recipe-card .meta{color:var(--muted); font-size:13.5px; margin-top:2px}
.pillrow{display:flex; gap:8px; flex-wrap:wrap; margin:10px 0 16px}
table.ing{width:100%; border-collapse:collapse; font-size:15.5px}
table.ing td{padding:9px 4px; border-bottom:1px dashed var(--line)}
table.ing td:nth-child(2){text-align:right; font-weight:700; white-space:nowrap}
table.ing td:nth-child(3){text-align:right; color:var(--muted); font-size:13px; width:64px; white-space:nowrap}
.stepline{display:flex; gap:12px; padding:10px 0; border-bottom:1px dashed var(--line); align-items:baseline}
.stepline .n{font-family:'Fraunces',serif; font-weight:700; color:var(--accent); min-width:26px}
.stepline .tmr{margin-left:auto; color:var(--muted); font-size:13px; white-space:nowrap; font-weight:700}
.timer-display{font-family:'Fraunces',serif; font-weight:700; font-size:72px; text-align:center; letter-spacing:1px; margin:8px 0; font-variant-numeric:tabular-nums}
.timer-display.done{color:var(--accent); animation:pulse 1s infinite}
@keyframes pulse{50%{opacity:.45}}
.progressbar{height:8px; background:var(--surface2); border-radius:99px; overflow:hidden; margin:10px 0}
.progressbar i{display:block; height:100%; background:linear-gradient(90deg,var(--gold),var(--accent)); border-radius:99px; transition:width .5s}
.stars{display:flex; gap:6px; font-size:30px; cursor:pointer; user-select:none}
.stars span{opacity:.25; transition:.15s}
.stars span.on{opacity:1}
.photo-grid{display:flex; gap:8px; flex-wrap:wrap; margin-top:8px}
.photo-grid img{width:92px; height:92px; object-fit:cover; border-radius:12px; border:1px solid var(--line)}
.photo-grid .addph{width:92px; height:92px; border-radius:12px; border:2px dashed var(--line); display:flex; align-items:center; justify-content:center; font-size:28px; color:var(--muted); cursor:pointer; background:none}
.modal-bg{position:fixed; inset:0; background:rgba(20,12,8,.5); z-index:60; display:flex; align-items:flex-end; justify-content:center; animation:fade .2s}
@keyframes fade{from{opacity:0}}
.modal{
  background:var(--bg); width:100%; max-width:760px; max-height:92vh; overflow:auto;
  border-radius:24px 24px 0 0; padding:20px 18px calc(24px + env(safe-area-inset-bottom));
  animation:up .25s cubic-bezier(.2,.9,.3,1);
}
@keyframes up{from{transform:translateY(40px); opacity:0}}
.modal .handle{width:44px; height:5px; border-radius:99px; background:var(--line); margin:0 auto 14px}
.empty{text-align:center; color:var(--muted); padding:36px 10px}
.empty .big{font-size:44px; margin-bottom:8px}
.kbd{background:var(--surface2); border:1px solid var(--line); border-radius:6px; padding:1px 7px; font-size:13px; font-weight:700}
.note{font-size:13.5px; color:var(--muted)}
pre.code{background:var(--surface2); border:1px solid var(--line); border-radius:var(--r-s); padding:12px; font-size:12.5px; white-space:pre-wrap; word-break:break-word; max-height:300px; overflow:auto}
.seg{display:flex; background:var(--surface2); border-radius:999px; padding:4px; gap:4px; border:1px solid var(--line)}
.seg button{flex:1; border:none; border-radius:999px; padding:9px 6px; background:none; color:var(--muted); font-weight:700; font-size:14px; cursor:pointer}
.seg button.on{background:var(--surface); color:var(--ink); box-shadow:var(--shadow)}
.toolgrid{display:grid; grid-template-columns:1fr 1fr; gap:12px}
.toolgrid .card{margin:0; text-align:center; cursor:pointer; padding:20px 10px}
.toolgrid .card .em{font-size:34px; margin-bottom:6px}
.toolgrid .card h3{font-size:15.5px; margin:0}
.result-box{background:var(--surface2); border-radius:var(--r-s); padding:14px; text-align:center; margin-top:14px}
.result-box .v{font-family:'Fraunces',serif; font-size:34px; font-weight:700; color:var(--primary)}
.feeditem{display:flex; gap:12px; padding:12px 0; border-bottom:1px dashed var(--line)}
.feeditem .dot{width:12px; height:12px; border-radius:50%; background:var(--gold); margin-top:6px; flex-shrink:0}
.toast{position:fixed; bottom:calc(var(--nav-h) + 18px + env(safe-area-inset-bottom)); left:50%; transform:translateX(-50%); background:var(--ink); color:var(--bg); padding:11px 20px; border-radius:999px; font-weight:600; z-index:90; animation:fade .2s; max-width:88vw; text-align:center}
.del-x{border:none; background:none; color:var(--accent); font-size:20px; cursor:pointer; padding:4px 8px}
.badge{display:inline-block; padding:2px 8px; border-radius:99px; font-size:11px; font-weight:700; background:var(--ok); color:#fff; margin-left:6px}
@media(min-width:700px){ .toolgrid{grid-template-columns:repeat(3,1fr)} .modal{border-radius:24px; align-self:center} .modal-bg{align-items:center} }
</style>
</head>

/* ============ IndexedDB ============ */
const DB_NAME='brew-center', DB_VER=1;
let db;
function openDB(){return new Promise((res,rej)=>{
  const r=indexedDB.open(DB_NAME,DB_VER);
  r.onupgradeneeded=e=>{const d=e.target.result;
    ['drinks','logs','stock','kv'].forEach(s=>{if(!d.objectStoreNames.contains(s))d.createObjectStore(s,{keyPath:'id'});});
  };
  r.onsuccess=e=>{db=e.target.result;res(db)}; r.onerror=()=>rej(r.error);
});}
const tx=(store,mode='readonly')=>db.transaction(store,mode).objectStore(store);
const dbAll=s=>new Promise(r=>{const q=tx(s).getAll();q.onsuccess=()=>r(q.result||[])});
const dbGet=(s,id)=>new Promise(r=>{const q=tx(s).get(id);q.onsuccess=()=>r(q.result)});
const dbPut=(s,v)=>new Promise(r=>{const q=tx(s,'readwrite').put(v);q.onsuccess=()=>r(v)});
const dbDel=(s,id)=>new Promise(r=>{const q=tx(s,'readwrite').delete(id);q.onsuccess=()=>r()});
const dbClear=s=>new Promise(r=>{const q=tx(s,'readwrite').clear();q.onsuccess=()=>r()});
const kvGet=async k=>(await dbGet('kv',k))?.v;
const kvSet=(k,v)=>dbPut('kv',{id:k,v});
const uid=()=> Date.now().toString(36)+Math.random().toString(36).slice(2,7);

function totalCost(r){return r.ingredients.reduce((a,i)=>a+(i.cost||0),0);}

async function loadFavs(){ favs=(await kvGet('favs'))||[]; }
async function toggleFav(id){ 
  if(favs.includes(id)) favs=favs.filter(x=>x!==id); else favs.push(id);
  await kvSet('favs',favs); vDrinks();
}
async function vDrinks(){
  drinks=await dbAll('drinks'); await loadFavs();
  let list=drinks
    .filter(r=>drinkFilter==='favs'?favs.includes(r.id):(drinkFilter==='all'||r.cat===drinkFilter))
    .filter(r=>!drinkSearch||tn(r.name).toLowerCase().includes(drinkSearch.toLowerCase()));
  // Sort: favorites first, then alphabetical
  list.sort((a,b)=>{
    const aFav=favs.includes(a.id)?0:1, bFav=favs.includes(b.id)?0:1;
    if(aFav!==bFav)return aFav-bFav;
    return tn(a.name).localeCompare(tn(b.name));
  });
  $('#view').innerHTML=`
  <h1>${t('drinks_title')}</h1><div class="tagline">${t('drinks_sub')}</div>
  <div class="row" style="margin-bottom:12px">
    <input class="grow" placeholder="${t('search')}" value="${esc(drinkSearch)}" oninput="drinkSearch=this.value;vDrinks()">
  </div>
  <div class="pillrow">
    <span class="chip ${drinkFilter==='all'?'on':''}" onclick="drinkFilter='all';vDrinks()">${t('cat_all')}</span>
    <span class="chip ${drinkFilter==='favs'?'on':''}" onclick="drinkFilter='favs';vDrinks()" style="color:var(--gold)">⭐ Favorites</span>
    ${CATS.map(c=>`<span class="chip ${drinkFilter===c?'on':''}" onclick="drinkFilter='${c}';vDrinks()">${catName(c)}</span>`).join('')}
  </div>
  ${list.map(r=>`<div class="card recipe-card" onclick="vDrinkDetail('${r.id}')">
     <div class="ico">${r.icon||ICONS[r.cat]||'🥤'}</div>
     <div class="grow"><h3>${esc(tn(r.name))}${favs.includes(r.id)?' ⭐':''}</h3>
       <div class="meta">${catName(r.cat)} · ${r.steps.length} ${t('steps').toLowerCase()}${r.serves?` · ${r.serves} ${t('serve_size_unit')}`:''}</div>
     </div><div style="color:var(--muted)">›</div></div>`).join('')
   || `<div class="empty"><div class="big">🥤</div>${LANG==='en'?'No drinks found':'ไม่พบเครื่องดื่ม'}</div>`}

let curScale=1, curSweetness=1, curIce=0.3;
const CUP_PRESETS={S:1, M:1.3, L:1.8};
const CUP_VOL_ML={S:355, M:473, L:650}; // physical cup volumes for Fill mode
let curCup=null;
async function vDrinkDetail(id,scale,sweetness,ice,cup){
  const r=await dbGet("drinks",id); if(!r)return go("drinks");
  // Load saved defaults if first open (no explicit params)
  if(scale===undefined&&sweetness===undefined&&ice===undefined&&cup===undefined){
    const defs=await kvGet('last-'+id);
    if(defs){ curScale=defs.scale||1; curSweetness=defs.sweetness!=null?defs.sweetness:1; curIce=defs.ice!=null?defs.ice:0.3; curCup=defs.cup||null; }
    else { curScale=1; curSweetness=1; curIce=0.3; curCup=null; }
  } else {
    curScale=scale!==undefined?scale:curScale; curSweetness=sweetness!==undefined?sweetness:curSweetness;
    curIce=ice!==undefined?ice:curIce; curCup=cup!==undefined?cup:curCup;
  }
  const isIce=i=>(tn(i.name)||"").toLowerCase().includes("ice")||(tn(i.name)||"").toLowerCase().includes("น้ำแข็ง");
  const fullVol=r.ingredients.reduce((a,i)=>a+(i.amount||0)*mlPerUnit(i)*curScale*(i.sweetener?curSweetness:1),0);
  const nonIceVol=r.ingredients.reduce((a,i)=>a+(i.amount||0)*mlPerUnit(i)*curScale*(isIce(i)?0:1)*(i.sweetener?curSweetness:1),0);
  // curIce < 0 = fill mode (Thai style): brew liquid at recipe strength, ice fills remaining space in glass
  const fillMode=curIce<0;
  const cupTargetVol=curCup?CUP_VOL_ML[curCup]:curScale*(r.serves||1)*355; // physical cup volume
  const realIce=fillMode?Math.max(0,(cupTargetVol-nonIceVol)/cupTargetVol):curIce;
  const totalVol=fillMode?cupTargetVol:fullVol;
  const iceVol=fillMode?Math.max(0,cupTargetVol-nonIceVol):totalVol*realIce;
  const liquidVol=totalVol-iceVol;
  const liquidScale=fillMode?1:(nonIceVol>0?liquidVol/nonIceVol:1);
  const adjAmt=i=>{let a=i.amount*curScale*(isIce(i)?(iceVol/(mlPerUnit(i)*curScale||0.001)):liquidScale)*(i.sweetener?curSweetness:1); return a;};
  const cost=r.ingredients.reduce((a,i)=>a+(i.cost||0)*curScale*(isIce(i)?(iceVol/(i.amount*mlPerUnit(i)*curScale||0.001)):liquidScale)*(i.sweetener?curSweetness:1),0);
  const hasIce=r.ingredients.some(i=>isIce(i));
  $('#view').innerHTML=`
  <button class="iconbtn" onclick="go('drinks')" style="margin-bottom:12px">‹ ${t('nav_drinks')}</button>
  <div class="row"><div style="font-size:42px">${r.icon||ICONS[r.cat]||'🥤'}</div>
    <div class="grow"><h1 style="margin:0;font-size:26px">${esc(tn(r.name))}</h1>
    <div class="note">${esc(r.source||'')}</div></div></div>
  ${r.notes?`<div class="card flat" style="margin-top:12px;background:var(--surface2);border-style:dashed">💡 ${esc(tn(r.notes))}</div>`:''}
  <div class="card" style="margin-top:12px">
    <h3 style="margin-bottom:4px">🥤 ${t('cup_size')}</h3>
    <div class="seg" style="margin:10px 0">
      ${[{k:'S',v:1},{k:'M',v:1.3},{k:'L',v:1.8}].map(c=>`<button class="${!curCup&&curScale===c.v?'on':curCup===c.k?'on':''}" onclick="vDrinkDetail('${id}',${c.v},${curSweetness},${curIce},'${c.k}')">${t('cup_'+c.k)}</button>`).join('')}
    </div>
    <div class="row" style="margin-top:8px">
      <span class="chip ${!curCup&&![1,1.3,1.8].includes(curScale)?'on':''}" onclick="vDrinkDetail('${id}',curScale,${curSweetness},${curIce},null)" style="cursor:pointer">${t('cup_custom')}</span>
      <span class="note grow" style="text-align:right">× ${fmtG(curScale)}</span>
    </div>
    <div class="row" style="margin-top:12px">
      ${[0.25,0.5,1,2,4].map(m=>`<button class="btn ghost" style="padding:4px 10px;font-size:13px;min-width:42px;height:32px" onclick="vDrinkDetail('${id}',${m},${curSweetness},${curIce},null)">×${m}</button>`).join('')}
    </div>

    <h3 style="margin-top:14px;margin-bottom:4px">🧊 ${t('ice_level')}</h3>
    <div class="seg" style="margin:10px 0">
      ${[{k:'none',v:0},{k:'fill',v:-1},{k:'regular',v:0.3},{k:'extra',v:0.5}].map(o=>`<button class="${curIce===o.v?'on':''}" onclick="vDrinkDetail('${id}',${curScale},${curSweetness},${o.v},${JSON.stringify(curCup)})">${t('ice_'+o.k)}</button>`).join('')}
    </div>
    ${r.ingredients.some(i=>i.sweetener)?`
    <h3 style="margin-top:14px;margin-bottom:4px">🍬 ${t('sweetness')}</h3>
    <div class="seg" style="margin:10px 0">
      ${[0,0.25,0.5,0.75,1].map(m=>`<button class="${curSweetness===m?'on':''}" onclick="vDrinkDetail('${id}',${curScale},${m},${curIce},${JSON.stringify(curCup)})">${t('sweetness_'+(m*100))}</button>`).join('')}
    </div>`:''}
    <div class="result-box" style="margin-top:10px">
      <div class="note">${t('total_volume')} · ${t('cost_est')}</div>
      <div class="v">${fmtG(totalVol)} ml · ${cost.toFixed(1)} ฿</div>
      <div class="note">${t('serve_size_label')}: ${r.serves?Math.round(r.serves*curScale):curScale} ${t('serve_size_unit')}${realIce>0?' · Liquid: '+Math.round(liquidVol)+' ml'+(hasIce?' · Ice: '+Math.round(iceVol)+' ml':'')+(' · Ice cubes: ~'+Math.round(iceVol/15)):''}${fillMode?' · 🧊 เติมเต็มแก้ว':''}</div>
    </div>
  </div>
  <div class="card">
    <h3>${t('ingredients')} <span class="note">(${t('cost_est')}: ${cost.toFixed(1)} ฿)</span></h3>
    <table class="ing">${r.ingredients.map(i=>`<tr>
      <td>${esc(tn(i.name))}</td>
      <td>${fmtG(adjAmt(i))} ${i.unit||'ml'}</td>
      <td>${((i.cost||0)*curScale*(isIce(i)?(iceVol/(i.amount*mlPerUnit(i)*curScale||0.001)):liquidScale)*(i.sweetener?curSweetness:1)).toFixed(1)} ฿</td></tr>`).join('')}</table>
  </div>
  <div class="card">
    <h3>${t('steps')}</h3>
    ${r.steps.map((s,i)=>`<div class="stepline"><span class="n">${i+1}</span>
      <div class="grow"><b>${esc(tn(s.t))}</b><div class="note">${esc(tn(s.d))}</div></div>
      ${s.m?`<span class="tmr">⏱ ${s.m>=60?(Math.round(s.m/6)/10)+' '+t('hr_short'):s.m>=1?s.m+' '+t('min_short'):Math.round(s.m*60)+'s'}</span>`:''}</div>`).join('')}
  </div>
  <button class="btn big" onclick="startBrew('${id}',curScale,curSweetness,curIce)">▶ ${t('start_brew')}</button>
  <div class="row" style="margin-top:12px">
    <button class="btn ghost grow" style="${favs.includes(id)?'color:var(--gold)':''}" onclick="toggleFav('${id}');vDrinkDetail('${id}',curScale,curSweetness,curIce)">${favs.includes(id)?'★':'☆'} Fav</button>
    <button class="btn ghost grow" onclick="shareDrink('${id}')">📤 ${LANG==='en'?'Share':'แชร์'}</button>
    <button class="btn ghost grow" onclick="drinkEditor('${id}')">✎ ${t('edit')}</button>
    <button class="btn ghost grow" onclick="dupDrink('${id}')">⧉ ${t('duplicate')}</button>
    ${r.seed?'':`<button class="btn ghost grow" style="color:var(--accent)" onclick="delDrink('${id}')">🗑 ${t('delete')}</button>`}
  </div>`;
}
async function shareDrink(id){
  const r=await dbGet('drinks',id); if(!r)return;
  let txt='☕ '+tn(r.name)+'\n';
  if(r.source) txt+='📖 '+r.source+'\n';
  txt+='\n📋 '+t('ingredients')+':\n';
  r.ingredients.forEach(i=>{ txt+='  • '+tn(i.name)+': '+i.amount+' '+i.unit+' ('+i.cost+' ฿)\n'; });
  txt+='\n📝 '+t('steps')+':\n';
  r.steps.forEach((s,i)=>{ txt+='  '+(i+1)+'. '+tn(s.t)+(s.m?' ⏱ '+s.m+'min':'')+'\n    '+tn(s.d)+'\n'; });
  txt+='\n📱 Brew Center · brew-center.app';
  try{ await navigator.clipboard.writeText(txt); toast(t('copied')); }
  catch(e){ prompt(LANG==='en'?'Copy this recipe:':'คัดลอกสูตร:',txt); }
}
async function dupDrink(id){
  const r=await dbGet('drinks',id);
  const c=JSON.parse(JSON.stringify(r)); c.id=uid(); c.seed=false;
  if(typeof c.name==='object'){c.name={en:c.name.en+' (copy)',th:(c.name.th||c.name.en)+' (copy)'};}else c.name+=' (copy)';
  await dbPut('drinks',c); toast(t('data_saved')); vDrinkDetail(c.id);
}
async function delDrink(id){
  if(!confirm(t('confirm_del')))return;
  const r=await dbGet('drinks',id);
  await dbDel('drinks',id);
  if(r){ const trash=await kvGet('trash')||[]; trash.push({item:r,type:'drink',at:Date.now()}); await kvSet('trash',trash.slice(-5)); }
  go('drinks');
  toastWithUndo(LANG==='en'?'Deleted.':'ลบแล้ว', async ()=>{
    const t=await kvGet('trash')||[]; const idx=t.findIndex(x=>x.item.id===id);
    if(idx>=0){ await dbPut('drinks',t[idx].item); t.splice(idx,1); await kvSet('trash',t); go('drinks'); toast(t('data_saved')); }
  });
}

let ed=null;
async function drinkEditor(id){
  ed = id ? JSON.parse(JSON.stringify(await dbGet('drinks',id)))
          : {id:uid(),icon:'🥤',cat:'coldcoffee',type:'cold',name:'',source:'',notes:'',serves:1,
             ingredients:[{name:'',amount:0,unit:'ml',cost:0}],steps:[{t:'',d:'',m:0}]};
  if(id){ed.seed=false; if(typeof ed.name==='object')ed.name=tn(ed.name);
    if(typeof ed.notes==='object')ed.notes=tn(ed.notes);
    ed.ingredients.forEach(i=>{if(typeof i.name==='object')i.name=tn(i.name)});
    ed.steps.forEach(s=>{if(typeof s.t==='object')s.t=tn(s.t); if(typeof s.d==='object')s.d=tn(s.d)});
  }
  edRender();
}

        ${['☕','🧊','🍵','🥤','🫧','✨','🍫','🥭','🧡','🍓','🍋','🍑','🍇','🥥','🍯','🌿','💜','🤎','🍬','🧋'].map(e=>`<button style="font-size:20px;padding:4px 6px;border:1px solid var(--line);border-radius:8px;background:var(--surface);cursor:pointer" onclick="$('#edIcon').value='${e}';$('#edIconPreview').textContent='${e}';ed.icon='${e}'">${e}</button>`).join('')}
      </div></div>
  </div>
  <label class="f">Type</label>
  <select id="edType"><option value="hot" ${ed.type==='hot'?'selected':''}>${t('type_hot')}</option>
  <option value="cold" ${ed.type==='cold'?'selected':''}>${t('type_cold')}</option></select>
  <label class="f">${t('serve_size_label')}</label><input id="edServes" type="number" inputmode="numeric" min="1" value="${ed.serves||1}">
  <label class="f">${t('source')}</label><input id="edSrc" value="${esc(ed.source||'')}">
  <label class="f">${t('notes_opt')}</label><textarea id="edNotes" rows="2">${esc(ed.notes||'')}</textarea>
  <label class="f">${t('ingredients')}</label>
  <div id="edIngs">${ed.ingredients.map((i,x)=>`<div class="row" style="margin-bottom:8px">
    <input class="grow" placeholder="${t('ingredient_name')}" value="${esc(i.name)}" onchange="ed.ingredients[${x}].name=this.value">
    <input type="number" inputmode="decimal" style="width:72px" placeholder="Amt" min="0" value="${i.amount||''}" onchange="ed.ingredients[${x}].amount=+this.value||0">
    <select style="width:72px" onchange="ed.ingredients[${x}].unit=this.value">
      ${['ml','shot','tbsp','tsp','cup','oz','slice','g'].map(u=>`<option value="${u}" ${i.unit===u?'selected':''}>${u}</option>`).join('')}</select>
    <input type="number" inputmode="decimal" style="width:64px" placeholder="฿" min="0" value="${i.cost||''}" onchange="ed.ingredients[${x}].cost=+this.value||0">

      <input type="number" inputmode="numeric" style="width:74px" placeholder="${t('minutes')}" min="0" step="0.5" value="${s.m||''}" onchange="ed.steps[${x}].m=+this.value||0">
      <button class="del-x" onclick="ed.steps.splice(${x},1);edSync();edRender()">✕</button></div>

function edSync(){
  ed.name=$('#edName')?.value??ed.name; ed.cat=$('#edCat')?.value??ed.cat;
  ed.icon=$('#edIcon')?.value??ed.icon; ed.type=$('#edType')?.value??ed.type;
  ed.source=$('#edSrc')?.value??ed.source; ed.notes=$('#edNotes')?.value??ed.notes;
  ed.serves=+$('#edServes')?.value||1;
}
async function edSave(){
  edSync();
  if(!ed.name.trim())return toast(LANG==='en'?'Name required':'กรุณาใส่ชื่อเมนู');
  ed.ingredients=ed.ingredients.filter(i=>String(i.name).trim());
  ed.steps=ed.steps.filter(s=>String(s.t).trim());
  await dbPut('drinks',ed); closeModal(); toast(t('data_saved')); vDrinkDetail(ed.id);
}

/* ============ AI Import ============ */
const AI_SCHEMA=`{
  "name": "Drink name",
  "cat": "hotcoffee | coldcoffee | tea | smoothie | soda | special",
  "type": "hot | cold",
  "icon": "one emoji",
  "serves": 1,
  "source": "original source / URL",
  "notes": "key tips in one or two sentences",
  "ingredients": [ {"name": "Espresso shot", "amount": 2, "unit": "shot", "cost": 8}, {"name": "Sugar syrup", "amount": 15, "unit": "ml", "cost": 0.5, "sweetener": true}, {"name": "Milk", "amount": 200, "unit": "ml", "cost": 6} ],
  "steps": [ {"t": "Step title", "d": "What to do", "m": 0} ]
}`;
function aiPrompt(){return `You are a drink-recipe structuring assistant for a cafe app (Brew Center). Convert the drink recipe into EXACTLY this JSON format and output ONLY the JSON (no markdown, no explanation):

${AI_SCHEMA}

Rules:
- ALL liquid amounts in ml (convert: 1 cup = 240 ml, 1 oz = 30 ml, 1 shot espresso = 30 ml, 1 tbsp = 15 ml, 1 tsp = 5 ml).
- "m" = timer in minutes — supports decimals (0.5 = 30s, 0.25 = 15s). Set to 0 if no waiting.
- "cost" = estimated ingredient cost in Thai Baht (฿) per the amount listed. Be reasonable for a Thai cafe.
- Mark sugar, syrup, honey, condensed milk, chocolate sauce as "sweetener": true. Other ingredients omit this field.
- Do NOT include ice as an ingredient — the app has ice level control (No Ice / Regular 30% / Extra 50% / Fill mode).
- "icon": pick ONE emoji that best represents the drink (☕🍵🥤🫧✨🍫🥭🧡🍋).
- Keep step titles short (2-5 words); put details in "d".
- Respond in ${LANG==='th'?'Thai (keep coffee terms like espresso, shot, latte art in English)':'English'}.

Here is the drink recipe:
`;}
function aiImport(){
  modal(`<h2>${t('ai_title')}</h2>
  <div class="note" style="white-space:pre-line;margin-bottom:12px">${t('ai_how')}</div>

function stepIngHint(r,s){
  const words=(tn(s.t)+' '+tn(s.d)).toLowerCase();
  const hits=r.ingredients.filter(i=>{
    const n=tn(i.name).toLowerCase().split(/[\s(（]/)[0];
    return n.length>2&&words.includes(n);
  });
  if(!hits.length)return '';
  return `<div style="margin-top:10px;padding-top:10px;border-top:1px dashed var(--line)" class="note">
    ${hits.map(i=>`<b>${esc(tn(i.name))}</b> ${fmtG(i.amount*session.scale*(isIce(i)?(session.ice<0?1:(session.ice||0)):(session.ice<0?1:(1-(session.ice||0))))*(i.sweetener?session.sweetness:1))} ${i.unit||'ml'}`).join(' · ')}</div>`;
}
function startTick(){stopTick(); tick(); tickInt=setInterval(tick,500);}
function stopTick(){if(tickInt){clearInterval(tickInt);tickInt=null;}}
function tick(){
  if(!session||!session.endsAt)return;
  const el=$('#tmr'); if(!el)return;
  let remain=session.paused?session.pausedRemain:session.endsAt-Date.now();
  const over=remain<0; const abs=Math.abs(remain);
  const m=Math.floor(abs/60000), sec=Math.floor(abs%60000/1000);
  const hh=m>=60?Math.floor(m/60)+':'+String(m%60).padStart(2,'0')+':'+String(sec).padStart(2,'0')
             :m+':'+String(sec).padStart(2,'0');
  el.textContent=(over?'+':'')+hh;
  el.classList.toggle('done',over);
  $('#tmrNote').textContent=over?t('elapsed')+' — '+t('step_done'):'';
  if(over&&!session.acknowledged){session.acknowledged=true;kvSet('session',session);ringBell();}
}
function addTime(min){
  if(!session.endsAt)return;
  if(session.paused)session.pausedRemain+=min*60000; else session.endsAt+=min*60000;
  session.acknowledged=false; kvSet('session',session); tick();
}
function pauseTimer(){
  if(session.paused){session.endsAt=Date.now()+session.pausedRemain;session.paused=false;}
  else{session.pausedRemain=session.endsAt-Date.now();session.paused=true;}
  kvSet('session',session); $('#btnPause').textContent=session.paused?t('resume'):t('pause');
}
async function nextStep(){
  const r=await dbGet('drinks',session.drinkId);
  session.step++; session.stepStartedAt=Date.now(); session.acknowledged=false; session.paused=false;
  const m=r.steps[session.step]?.m||0;
  session.endsAt=m?Date.now()+m*60000:null;
  await kvSet('session',session); vBrew();
}
async function abortBrew(){
  if(!confirm(LANG==='en'?'Abort this brew?':'ยกเลิกการชงครั้งนี้?'))return;
  session=null; await kvSet('session',null); stopTick(); releaseWake(); vBrew();
}
async function finishBrew(){
  const r=await dbGet('drinks',session.drinkId);
  const fin={drinkId:session.drinkId,drinkName:session.drinkName,scale:session.scale,sweetness:session.sweetness!=null?session.sweetness:1,ice:session.ice!=null?session.ice:0.3,startedAt:session.startedAt};
  // Auto-deduct stock
  if(r) await autoDeductStock(r, session.scale, fin.sweetness, fin.ice);
  session=null; await kvSet('session',null); stopTick(); releaseWake();
  logEditor(null,fin);
}

async function autoDeductStock(r, scale, sweetness, ice){
  const stock=await dbAll('stock'); if(!stock.length)return;
  const isIce=i=>(tn(i.name)||'').toLowerCase().includes('ice')||(tn(i.name)||'').toLowerCase().includes('น้ำแข็ง');
  const nonIceVol=r.ingredients.reduce((a,i)=>a+(i.amount||0)*mlPerUnit(i)*scale*(isIce(i)?0:1)*(i.sweetener?sweetness:1),0);
  const fullVol=r.ingredients.reduce((a,i)=>a+(i.amount||0)*mlPerUnit(i)*scale*(i.sweetener?sweetness:1),0);
  const fillMode=ice<0;
  const cupTargetVol=CUP_PRESETS[Object.keys(CUP_PRESETS).find(k=>CUP_PRESETS[k]===scale)]?CUP_VOL_ML[Object.keys(CUP_VOL_ML).find(k=>CUP_PRESETS[k]===scale)]:scale*(r.serves||1)*355;
  const totalVol=fillMode?cupTargetVol:fullVol;
  const realIce=fillMode?Math.max(0,(cupTargetVol-nonIceVol)/cupTargetVol):ice;
  const iceVol=fillMode?Math.max(0,cupTargetVol-nonIceVol):totalVol*realIce;
  const liquidScale=fillMode?1:(nonIceVol>0?(totalVol-iceVol)/nonIceVol:1);
  for(const ing of r.ingredients){
    if(isIce(ing)) continue; // skip ice — handled by ice mode
    const used=ing.amount*scale*(isIce(ing)?(iceVol/(mlPerUnit(ing)*scale||0.001)):liquidScale)*(ing.sweetener?sweetness:1);
    const name=tn(ing.name).toLowerCase();
    for(const s of stock){
      if(!s.name)continue;
      const sn=s.name.toLowerCase();
      if(name.includes(sn)||sn.includes(name.split(/[\s(（]/)[0])){
        s.qty=Math.max(0,(s.qty||0)-used);
        await dbPut('stock',s);
        break;
      }
    }
  }
}

/* ============ Bell & Wake Lock ============ */
let actx;
function primeAudio(){
  try{
    actx=actx||new (window.AudioContext||window.webkitAudioContext)();
    if(actx.state==='suspended')actx.resume();
  }catch(e){}
}
document.addEventListener('click',primeAudio,{capture:true});
document.addEventListener('touchend',primeAudio,{capture:true});
function ringBell(){
  try{
    actx=actx||new (window.AudioContext||window.webkitAudioContext)();
    if(actx.state==='suspended')actx.resume();
    let n=0;
    const ding=()=>{
      if(n++>5)return;
      [880,1318].forEach((f,i)=>{
        const o=actx.createOscillator(),g=actx.createGain();
        o.frequency.value=f; o.type='sine'; o.connect(g); g.connect(actx.destination);
        const t0=actx.currentTime+i*.05;
        g.gain.setValueAtTime(.001,t0); g.gain.exponentialRampToValueAtTime(.4,t0+.02);
        g.gain.exponentialRampToValueAtTime(.001,t0+.9); o.start(t0); o.stop(t0+1);
      });
      setTimeout(ding,1400);
    };
    ding();
  }catch(e){}
  if(navigator.vibrate)navigator.vibrate([300,150,300,150,500]);
}
async function acquireWake(){
  try{ if(!wakeLock&&'wakeLock' in navigator) wakeLock=await navigator.wakeLock.request('screen'); }catch(e){}
}
function releaseWake(){ try{wakeLock?.release(); wakeLock=null;}catch(e){} }
document.addEventListener('visibilitychange',()=>{ if(document.visibilityState==='visible'&&session)acquireWake(); });

function scCalc(){const f=+$('#scFrom').value||0,t=+$('#scTo').value||0;$('#scOut').textContent=f?'× '+(Math.round(t/f*100)/100):'—';}
function uCalc(){const a=+$('#uAmt').value||0,u=$('#uUnit').value;
  const ml=u==='oz'||u==='shot'?a*30:u==='tbsp'?a*15:u==='tsp'?a*5:u==='cup'?a*240:u==='liter'?a*1000:a;

async function importStockFromMenu(){
  const drinks=await dbAll('drinks'), stock=await dbAll('stock');
  const stockNames=stock.map(s=>(s.name||'').toLowerCase().trim());
  let added=0;
  for(const r of drinks){
    for(const ing of r.ingredients||[]){
      const name=tn(ing.name).trim(); if(!name||name.length<2)continue;
      const n=name.toLowerCase();
      if(stockNames.some(s=>s===n||s.includes(n)||n.includes(s)))continue;
      // Determine reasonable defaults
      const unit=ing.unit||'ml';
      const min=unit==='ml'?500:unit==='shot'?20:unit==='cup'?5:unit==='g'?200:10;
      const item={id:uid(),name,unit,qty:min*2,min,cost:ing.cost||0,note:'Imported from menu',updated:Date.now()};
      await dbPut('stock',item); stockNames.push(n); added++;
    }
  }
  toast(added?(LANG==='en'?`Added ${added} stock items from menu`:`เพิ่ม ${added} รายการสต็อกจากเมนู`):(LANG==='en'?'All ingredients already in stock':'ส่วนผสมทั้งหมดมีในสต็อกแล้ว'));
  vStock();
}

  $('#lgPhotos').innerHTML=logPhotos.map((p,i)=>`<div style="position:relative"><img src="${p}">

  +(logPhotos.length<3?`<button class="addph" onclick="$('#lgFile').click()">＋</button>`:'');
}
function addLogPhoto(input){
  const file=input.files[0]; if(!file)return;
  const img=new Image(), rd=new FileReader();
  rd.onload=()=>{img.src=rd.result};
  img.onload=()=>{
    const MAX=900, sc=Math.min(1,MAX/Math.max(img.width,img.height));
    const c=document.createElement('canvas'); c.width=img.width*sc; c.height=img.height*sc;
    c.getContext('2d').drawImage(img,0,0,c.width,c.height);
    logPhotos.push(c.toDataURL('image/jpeg',.72)); renderLogPhotos();
  };
  rd.readAsDataURL(file); input.value='';
}
async function delLog(id){
  if(!confirm(t('confirm_del')))return;
  const l=await dbGet('logs',id);
  await dbDel('logs',id);
  if(l){ const trash=await kvGet('trash')||[]; trash.push({item:l,type:'log',at:Date.now()}); await kvSet('trash',trash.slice(-5)); }
  vLog();
  toastWithUndo(LANG==='en'?'Log deleted.':'ลบบันทึกแล้ว', async ()=>{
    const t=await kvGet('trash')||[]; const idx=t.findIndex(x=>x.item.id===id);
    if(idx>=0){ await dbPut('logs',t[idx].item); t.splice(idx,1); await kvSet('trash',t); vLog(); toast(t('data_saved')); }
  });
}

async function gatherBackup(){
  return {app:'brew-center',version:1,exportedAt:new Date().toISOString(),
    drinks:await dbAll('drinks'),logs:await dbAll('logs'),stock:await dbAll('stock')};
}
function downloadBackup(data){
  const blob=new Blob([JSON.stringify(data)],{type:'application/json'});
  const a=document.createElement('a'); a.href=URL.createObjectURL(blob);
  a.download='brew-center-backup-'+new Date().toISOString().slice(0,10)+'.json'; a.click();
  setTimeout(()=>URL.revokeObjectURL(a.href),2000);
}
async function exportData(){
  downloadBackup(await gatherBackup());
  await kvSet('lastBackup',dayStr()); toast(t('data_saved'));
}
async function importData(input){
  const file=input.files[0]; if(!file)return;
  if(!confirm(t('import_warn')))return void(input.value='');
  try{
    const j=JSON.parse(await file.text());
    if(j.app!=='brew-center')throw 0;
    await dbClear('drinks'); await dbClear('logs'); await dbClear('stock');
    for(const r of j.drinks||[])await dbPut('drinks',r);
    for(const l of j.logs||[])await dbPut('logs',l);
    for(const s of j.stock||[])await dbPut('stock',s);
    closeModal(); toast(t('data_saved')); render();
  }catch(e){toast(t('invalid_json'));}
  input.value='';
}

/* ============ Auto daily backup ============ */
function dayStr(){const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
let backupDue=false;
async function runAutoBackup(){
  if(!backupDue)return; backupDue=false;
  const data=await gatherBackup();
  if(!(data.logs.length||data.stock.length||data.drinks.some(r=>!r.seed)))return;
  downloadBackup(data);
  await kvSet('lastBackup',dayStr()); toast(t('auto_backup_done'));
}
function armAutoBackup(){
  const h=()=>{document.removeEventListener('click',h,true);document.removeEventListener('touchend',h,true);runAutoBackup();};
  document.addEventListener('click',h,true);
  document.addEventListener('touchend',h,true);
}

let helpTab='guide';
function openHelp(tab){
  if(tab)helpTab=tab;
  const guide=GUIDE.map(g=>`<div class="card flat" style="background:var(--surface2);margin-bottom:10px;padding:12px">
    <b>${g.icon} ${esc(tn(g.t))}</b><div class="note" style="margin-top:4px">${esc(tn(g.d))}</div></div>`).join('');
  const log=CHANGELOG.map(e=>`<div class="card flat" style="margin-bottom:10px;padding:10px 12px">
    <div class="row"><b style="font-family:'Fraunces',serif;color:var(--primary)">v${e.v}</b>
      <span class="note grow" style="text-align:right">${e.d}</span></div>
    <ul style="margin:6px 0 0;padding-left:18px">${e.c.map(c=>`<li class="note">${esc(tn(c))}</li>`).join('')}</ul></div>`).join('');
  modal(`<h2>${t('help_title')}</h2>
  <div class="seg" style="margin-bottom:14px">
    <button class="${helpTab==='guide'?'on':''}" onclick="openHelp('guide')">${t('help_guide')}</button>
    <button class="${helpTab==='log'?'on':''}" onclick="openHelp('log')">${t('help_changelog')}</button>
  </div>
  ${helpTab==='guide'?guide:log}
  <button class="btn ghost big" style="margin-top:8px" onclick="closeModal()">${t('close')}</button>`);
}

/* ============ Boot ============ */
(async function(){
  try{
    await openDB();
    const seeded=await kvGet('seeded-v1');
    if(!seeded){ for(const s of SEEDS) if(!(await dbGet('drinks',s.id))) await dbPut('drinks',s); await kvSet('seeded-v1',true); }
    LANG=(await kvGet('lang'))||'en';
    const th=(await kvGet('theme'))||(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light');
    document.body.dataset.theme=th;
    document.querySelector('meta[name=theme-color]').content=th==='dark'?'#1A1410':'#F5F0EB';
    session=await kvGet('session');
    // Only resume brew if session is recent (< 2 hours old)
    if(session && Date.now()-session.startedAt < 7200000) TAB='brew';
    else if(session){ session=null; await kvSet('session',null); }
    if((await kvGet('lastBackup'))!==dayStr()){ backupDue=true; armAutoBackup(); }
  }catch(e){
    console.error('Brew Center init error:',e);
    $('#view').innerHTML='<div class="empty"><div class="big">⚠️</div><h3>App failed to start</h3><div class="note">Please check that your browser supports IndexedDB and storage is not blocked.</div></div>';
    renderNav();
    return;
  }
  render();
})();
</script>
